version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tikuser-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tikuser
      POSTGRES_PASSWORD: tikuser_secret
      POSTGRES_DB: tikuser_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tikuser -d tikuser_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tikuser-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://tikuser:tikuser_secret@postgres:5432/tikuser_db?schema=public"
      PORT: 3000
      HOST: "0.0.0.0"
      NODE_ENV: "production"
      LOG_LEVEL: "info"
      TIKTOK_CONNECTOR_MODE: "mock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
    driver: local
